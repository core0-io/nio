# Runtime guard pipeline settings (phases 0–6) + scan rules.
#
# To apply an operator-provided version of this file in one shot, run:
#   /nio config import <path>
# nio runs `/nio doctor` against the incoming config first; if any check
# fails, your live ~/.nio/config.yaml is NOT modified. On success the old
# file is preserved as config.yaml.bak.<ISO-stamp>.

# Telemetry agent identity (alias). When set, replaces the platform-derived
# `gen_ai.agent.name` attribute on emitted traces + log records, and lands
# as a separate `agent_name` field in ~/.nio/audit.jsonl. The `nio.platform`
# dimension stays untouched, so backends still see both axes (platform +
# agent_name). Leave empty to keep the current behaviour where
# gen_ai.agent.name = platform. Metrics intentionally do NOT carry this
# attribute (cardinality budget).
agent_name: ""

guard:
  # Protection level: strict | balanced | permissive
  # Maps the aggregated final score (0.0 — 1.0) to allow / confirm / deny:
  #
  #   level       | allow      | confirm    | deny
  #   ------------|------------|------------|----------
  #   strict      | 0.0 — 0.5  | (none)     | 0.5 — 1.0
  #   balanced    | 0.0 — 0.5  | 0.5 — 0.8  | 0.8 — 1.0  (default)
  #   permissive  | 0.0 — 0.9  | (none)     | 0.9 — 1.0
  #
  # The deny threshold also acts as the per-phase short-circuit cutoff: if
  # any single phase reaches it, the pipeline stops and denies immediately.
  # See docs/phases/scoring.html for how the final score is aggregated
  # across phases.
  protection_level: balanced

  # Confirm fallback: what to do when the guard decision is "confirm"
  # but the platform has no interactive confirmation (e.g. OpenClaw).
  #   allow — let the action through, log a warning (default)
  #   deny  — block the action
  #   ask   — use platform confirm if available, else fall back to allow
  confirm_action: allow

  # Extra regex patterns for scan rules (Phase 3 static analysis + scan command).
  # Keys are rule module names; values are arrays of regex pattern strings.
  # All rules within the named module receive the extra patterns.
  #
  # Modules: shell_exec, remote_loader, secrets, obfuscation,
  #          prompt_injection, exfiltration, trojan
  #
  # Example:
  #   file_scan_rules:
  #     shell_exec:
  #       - "my_unsafe_exec\\("
  file_scan_rules:
    shell_exec: []        # SHELL_EXEC [high], AUTO_UPDATE [critical]
    remote_loader: []     # REMOTE_LOADER [critical]
    secrets: []           # READ_ENV_SECRETS [medium], READ_SSH_KEYS/READ_KEYCHAIN/PRIVATE_KEY_PATTERN [critical]
    obfuscation: []       # OBFUSCATION [high]
    prompt_injection: []  # PROMPT_INJECTION [critical]
    exfiltration: []      # NET_EXFIL_UNRESTRICTED [high], WEBHOOK_EXFIL [critical]
    trojan: []            # TROJAN_DISTRIBUTION [critical], SUSPICIOUS_PASTE_URL [high], SUSPICIOUS_IP/SOCIAL_ENGINEERING [medium]

  # ── Phase 2 guard analysis: extra patterns for runtime action evaluation ──
  #
  # Two kinds of fields below:
  #   String fields   — plain strings, matched as described per field (case-
  #                     insensitive substring / prefix / domain suffix, etc.).
  #                     No regex metacharacters, no escaping.
  #   Regex fields    — names ending in "_patterns". Each entry is either a
  #                     bare regex string or the "/pattern/flags" form (flags:
  #                     g i m s u y). YAML requires backslashes to be escaped,
  #                     so write "\\d", "\\/", "\\." inside quotes.
  #
  # All fields EXTEND the built-in detection lists; they never replace them.
  # Every match produces a Phase 2 finding at the severity shown in [brackets].
  #
  # Full example:
  #   action_guard_rules:
  #     dangerous_commands: ["format c:", "shutdown -h"]
  #     dangerous_patterns: ["/rm\\s+-rf\\s+\\//"]
  #     webhook_domains:    ["evil-webhook.example.com"]
  #     sensitive_paths:    ["/var/secrets/", ".env.prod"]
  action_guard_rules:
    # Dangerous command strings. Case-insensitive substring match against the
    # full command line (command + args joined by spaces). Use this for fixed
    # literal fragments you want to hard-block.                      [critical]
    # Example: ["format c:", "shutdown -h now", ":(){ :|:& };:"]
    dangerous_commands: []

    # Dangerous command regexes. Matched against the full command line. Use
    # when you need alternation, capture groups, anchors, or character classes
    # the substring form can't express.                              [critical]
    # Syntax: "pattern" or "/pattern/flags"
    # Example: ["/rm\\s+-rf\\s+\\//", "/curl\\s+.*\\|\\s*(ba)?sh/i"]
    dangerous_patterns: []

    # Commands that read sensitive data (keys, secrets, env, dotfiles).
    # Case-insensitive substring match against the full command line. Built-in
    # list already covers /etc/passwd, ~/.ssh, ~/.aws, printenv, etc.     [high]
    # Example: ["cat /vault/", "gpg --decrypt"]
    sensitive_commands: []

    # System-modifying command names (user mgmt, services, filesystem admin).
    # Case-insensitive match at the start of the command OR after a space —
    # i.e. word-boundary match on the program name. Include a trailing space
    # for short names to prevent false prefix hits (e.g. "su " not "su").  [high]
    # Example: ["apt-get", "brew install", "launchctl"]
    system_commands: []

    # Network tool command names. Same word-boundary match rule as
    # system_commands. Flags any use of these tools regardless of target. [medium]
    # Example: ["aria2c", "httpie", "wget2"]
    network_commands: []

    # Webhook / exfiltration domains. Matches when the request URL's hostname
    # is exactly the entry OR a subdomain of it ("foo.example.com" is covered
    # by "example.com"). No scheme, no path, no port.                     [high]
    # Example: ["webhook.site", "requestbin.net", "ngrok-free.app"]
    webhook_domains: []

    # Sensitive file path fragments. Matching is substring-based with a        [critical]
    # specific convention: the matcher prepends "/" to each pattern and then
    # tests `normalized_path.includes("/" + pattern) || normalized_path.endsWith(pattern)`.
    # The input path is normalized first: ~/ is expanded to /HOME/, backslashes
    # become forward slashes.
    #
    # Two supported shapes:
    #   • Directory fragment — DO NOT include a leading slash; the matcher
    #     adds one. Use "etc/" (matches "/etc/passwd"), "raw_files/" (matches
    #     "/anywhere/raw_files/x" and "~/raw_files/x" after normalization),
    #     ".ssh/" (matches "/home/user/.ssh/key").
    #     Writing "/etc/" is a common mistake — it becomes "//etc/" internally
    #     and almost never matches.
    #   • Filename suffix — matched via endsWith; absolute/relative both work
    #     (e.g. ".env", "id_rsa", "credentials.json", ".env.prod").
    #
    # Known gap: a bare relative path like "raw_files/foo.txt" (no leading /)
    # does NOT match a "raw_files/" pattern because there's no "/" before it.
    # Use sensitive_path_patterns below with "/^raw_files\\//" for this case.
    #
    # Example: ["var/secrets/", "raw_files/", ".env.prod", "credentials.json"]
    sensitive_paths: []

    # Sensitive path regexes — covers dynamic segments, relative paths, and
    # anything the substring form can't express. Matched against the same
    # normalized path (~/ expanded to /HOME/).                       [critical]
    # Syntax: "pattern" or "/pattern/flags"
    # Examples:
    #   - "/^\\/abc\\/[^/]+\\/def/"      # /abc/<id>/def (dynamic segment)
    #   - "/^raw_files\\//"              # relative "raw_files/..." paths
    #   - "/\\.env\\.[a-z]+$/i"          # .env.prod, .env.staging, ...
    sensitive_path_patterns: []

    # Secret detection regexes for HTTP request bodies (network_request
    # actions). Matched against the body preview. Use for internal token
    # formats the built-in detector doesn't know about.              [high]
    # Syntax: "pattern" or "/pattern/flags"
    # Example: ["/ACME_[A-Z0-9]{32}/", "/internal-token:\\s*[\\w-]+/i"]
    secret_patterns: []

  # LLM analyser settings (Phase 5 semantic analysis using Claude).
  # Requires api_key to be set. Disable with enabled: false.
  llm_analyser:
    # Enable/disable Phase 5 LLM analysis.
    enabled: false
    # Anthropic API key for LLM-based security analysis.
    api_key: ""
    # Model identifier for LLM analysis.
    model: "claude-sonnet-4-20250514"
    # Maximum input token budget sent to the LLM per scan.
    max_input_tokens: 50000

  # External scoring APIs (Phase 6). 0..N endpoints, each fetched concurrently;
  # results contribute to the final risk score via per-endpoint `weight`. nio
  # always issues GET requests — encode any context the endpoint needs as
  # query parameters in the endpoint URL itself (e.g. ?agent-name=X).
  #
  # ENDPOINT RESPONSE CONTRACT — each endpoint must return JSON of the shape:
  #   { "score": 0.42, "reason": "..." }
  # `score` is required (finite number, clamped to [0, 1]); `reason` is optional.
  # Any other shape is rejected with an external_analyser/response_invalid
  # diagnostic. See docs/phases/phase-6-external.html#response-contract.
  # Use `/nio doctor` to verify an endpoint conforms before relying on it.
  #
  # Authentication is optional: omit `auth` for unauthenticated endpoints,
  # or choose `bearer` (static API key) / `oauth` (OAuth2
  # client_credentials grant with disk-backed token cache at ~/.nio/oauth-cache/).
  #
  # Optional `headers` map adds custom request headers (e.g. X-Tenant-Id).
  # User entries override nio defaults including Authorization.
  #
  # Multiple endpoints sharing the same OAuth identity (oauth_url + client_id
  # + client_secret) automatically share a single token cache and only POST
  # /token once.
  #
  # external_analyser:
  #   # 1) No auth — public scoring endpoint
  #   - name: scorer_plain
  #     enabled: true
  #     endpoint: "https://plain.example.com/score"
  #     timeout: 3000
  #     weight: 1.0
  #
  #   # 2) Bearer / static API key
  #   - name: scorer_a
  #     enabled: true
  #     endpoint: "https://a.example.com/score"
  #     timeout: 3000
  #     weight: 2.0
  #     auth:
  #       type: bearer
  #       api_key: "sk-..."
  #
  #   # 3) OAuth2 client_credentials. Pre-register the client with the
  #   #   OAuth provider and paste its credentials below — nio POSTs
  #   #   {oauth_url}/token with grant_type=client_credentials, caches the
  #   #   bearer token at ~/.nio/oauth-cache/, and re-fetches when it nears
  #   #   expiry. No PKCE, no refresh_token, no /register, no /code.
  #   - name: scorer_primary
  #     enabled: true
  #     endpoint: "https://scoring.example.com/api/scores/agent?agent-name=cc"
  #     weight: 2.0
  #     # headers:                    # optional
  #     #   X-Tenant-Id: "..."
  #     auth:
  #       type: oauth
  #       oauth_url:     "https://scoring.example.com/oauth"
  #       client_id:     "..."
  #       client_secret: "..."
  external_analyser: []

  # Phase 1 allowlist: additional command prefixes treated as safe.
  # Commands matching these prefixes bypass the guard pipeline.
  # Example: ["npm run", "pnpm "]
  allowed_commands: []

  # Phase 1 allowlist behavior when a command matches:
  #   continue — match → hint only, still run Phase 2-6 (default)
  #   exit     — match → allow + exit immediately (fastest, skips all later phases)
  #
  # Default is "continue" so external/LLM policy can't be bypassed by the
  # built-in SAFE_COMMAND_PREFIXES list (ls, grep, git status, ...). Switch
  # to "exit" if you want the fast path and don't mind allowlisted commands
  # skipping Phase 2-6 entirely.
  allowlist_mode: continue

  # Phase 0 tool gate, per platform. Checked before any content analysis.
  # Strict allowlist: when non-empty for a namespace, ONLY listed tools pass
  # Phase 0 on that platform; everything else is denied.
  # The `mcp` list is platform-agnostic and applies whenever the incoming tool
  # is an MCP tool. List entries as you would see the tool name in the hook
  # payload — no prefix-stripping needed. Two forms are supported:
  #   • Bare local name (e.g. `HassTurnOn`) — matches any MCP server, plus
  #     any Hermes single-underscore form like `mcp_config_db_get_current_config`.
  #   • Server-qualified (e.g. `hass__HassTurnOn`) — that server only;
  #     applies to claude-code / codex / openclaw and Hermes's `__` form.
  # Matching is case-insensitive throughout.
  #
  # The `mcp` list also covers indirect MCP invocations embedded in
  # shell commands. Phase 0 unwraps the command (16 layers covering
  # shells, heredocs, evals, encodings, package wrappers, ssh/docker
  # exec, …) and runs detectors (mcporter, curl/wget/HTTPie,
  # language-runtime one-liners, TCP/socket multiplexers, stdio
  # JSON-RPC pipes, package runners, etc.) against every fragment,
  # mapping each hit back to {server, tool} via the MCP server registry.
  # See docs/phases/phase-0-tool-gate.html for the full capture model.
  permitted_tools:
    claude_code: []
    openclaw: []
    hermes: []
    codex: []
    pi: []
    opencode: []
    mcp: []
  # Listed tools are unconditionally blocked.
  blocked_tools:
    claude_code: []
    openclaw: []
    hermes: []
    codex: []
    pi: []
    opencode: []
    mcp: []

  # Manual additions to the MCP server registry, for SaaS or otherwise
  # non-discoverable servers (Phase 0 auto-discovers from ~/.claude.json,
  # Claude Desktop, ~/.hermes/config.yaml, ~/.codex/config.toml,
  # ~/.openclaw/openclaw.json by default — declare here only what's
  # missing). Each entry's key is the
  # server name; its value lists every handle (URL / unix socket / server
  # binary / npx package) that identifies the server, so indirect
  # detectors can route a curl URL / unix socket / binary name / npx
  # package back to the server name.
  #
  # mcp_servers:
  #   hass:
  #     urls:        ['http://localhost:5173/mcp']
  #     sockets:     ['/tmp/mcp-hass.sock']
  #     binaries:    ['mcp-server-hass']
  #     cliPackages: ['@hass/mcp-cli']
  mcp_servers: {}

  # Native tool name → action type mapping, per platform. NOT a third
  # allow/deny list — this is the classification table that decides which
  # Phase 1-6 rule set runs for each platform-native tool. Tools listed
  # here enter Phase 1-6 deep analysis with the mapped action type.
  #
  # Unmapped tools follow this fallback chain in the hook engine:
  #   1. MCP tools (auto-detected by name) dispatch as `mcp_tool_call`
  #      and flow through Phase 1-6 — Phase 3 statically scans the
  #      JSON-serialised args, Phase 5/6 LLM and external scorers
  #      receive the same payload. (Phase 2 has no built-in MCP rule set
  #      yet; user-defined patterns in `action_guard_rules` don't apply
  #      to MCP today.)
  #   2. Anything else is logged with risk tag `UNCATEGORIZED_TOOL:<tool_name>`
  #      in the audit log and allowed through without Phase 1-6 analysis.
  #      Filter / group on the `UNCATEGORIZED_TOOL:` prefix downstream to
  #      see which tools are running un-analysed.
  native_tool_mapping:
    claude_code:
      Bash: exec_command
      Write: write_file
      Edit: write_file
      WebFetch: network_request
      WebSearch: network_request
    openclaw:
      exec: exec_command
      write: write_file
      web_fetch: network_request
      browser: network_request
    hermes:
      terminal: exec_command
      exec: exec_command
      shell: exec_command
      write_file: write_file
      patch: write_file
      read_file: read_file
      fetch: network_request
      http_request: network_request
    codex:
      # Codex's only first-party tool is Bash; all writes/reads/fetches
      # surface as shell commands and route through Phase 1-6 via
      # exec_command. Plugin- and MCP-provided tools (Write, Edit, etc.)
      # are dynamic and handled separately.
      Bash: exec_command
    pi:
      # Pi core ships bash/read/write/edit/ls/find/grep and has no
      # network tool; network access flows through bash and is caught
      # by the Phase 1-6 command analysis. ls/find/grep are deliberately
      # unmapped (directory metadata reads, not file content reads).
      bash: exec_command
      write: write_file
      edit: write_file
      read: read_file
    opencode:
      # opencode ships read/write/edit/apply_patch/glob/grep/list/bash/
      # task/todowrite/todoread/webfetch/websearch/lsp/skill/question.
      # glob/grep/list/todo*/lsp/skill/question are deliberately unmapped
      # (navigation and bookkeeping, not effects on the world); task is a
      # sub-agent concern, not an action.
      bash: exec_command
      write: write_file
      edit: write_file
      apply_patch: write_file
      read: read_file
      webfetch: network_request
      websearch: network_request

  # Phase scoring weights for weighted score aggregation.
  #   final_score = Σ(wi × si) / Σ(wi)  (only phases that ran)
  # Phase 6 weights live per-endpoint on external_analyser[].weight, not here.
  scoring_weights:
    runtime: 1.0       # Phase 2: pattern matching
    static: 1.0        # Phase 3: static rules on file content
    behavioural: 2.0   # Phase 4: AST dataflow analysis
    llm: 1.0           # Phase 5: LLM semantic analysis

# Telemetry collection — shared OTLP connection + per-signal settings.
# OTLP export is disabled by default (empty endpoint). Set endpoint to enable;
# per-signal `enabled` flags then gate which signals get exported. Local JSONL
# files keep working regardless of endpoint — they're controlled by the
# per-signal `local` flag.
collector:
  # OTLP collector base URL. /v1/traces, /v1/metrics, /v1/logs are appended
  # automatically. Leave empty to disable OTLP export entirely.
  # Example: "http://localhost:4318"
  endpoint: ""
  # Session-level capture switch.
  #
  # false (default) — no session exports telemetry until it is explicitly
  #   armed inside that session: `/nio-monitor on` where the focused skill
  #   is installed (Claude Code, Codex, Pi, opencode), `/nio monitor on`
  #   on OpenClaw and Hermes.
  # true            — every session exports telemetry (CI / team machines).
  #
  # Guard enforcement and the local audit log are unaffected either way.
  monitor_all_sessions: false
  # Bearer token for OTLP endpoint authentication.
  api_key: ""
  # Extra request headers sent to the OTLP endpoint. Values are stringified.
  headers: {}
  # OTLP export timeout in milliseconds.
  timeout: 5000
  # OTLP transport protocol: http | grpc
  #   http — HTTP/JSON on port 4318
  #   grpc — gRPC on port 4317
  protocol: http

  # Metrics signal (counters, histograms). Exported via OTLP only — there
  # is no local metrics file. Hook event audit records live in the audit
  # log (see `logs` block below).
  metrics:
    enabled: true

  # Traces signal (spans for tool calls, turns, tasks).
  traces:
    enabled: true

  # Logs signal. Carries two different things: audit entries (guard, scan,
  # lifecycle events), which go both to OTLP and to the local JSONL, and
  # conversation content records (reasoning, replies, tool arguments and
  # results) which go to OTLP only — never to the local file.
  logs:
    # Enable OTEL Logs export to collector endpoint.
    enabled: true
    # Enable local JSONL backup at the path below (audit entries only).
    local: true
    # Path to local JSONL audit log. Supports ~/ prefix.
    path: "~/.nio/audit.jsonl"
    # Maximum local file size in MB before rotation (0 = no rotation).
    max_size_mb: 100

  # Per-kind size caps for conversation content records, in UTF-8 BYTES.
  # Cuts land on whole character boundaries and append "…[truncated]".
  #
  # These exist to contain pathological output (a `cat` of a huge file, a
  # `find /` dump), not to clip normal conversation — typical reasoning
  # and replies run 2–10 KB and never reach them. Unbounded content does
  # break real limits downstream: OTLP gRPC's 4 MB per-message ceiling
  # fails the WHOLE export, the hook blocks its host while serialising,
  # and some log backends reject over-long lines.
  #
  # Set any kind to 0 to capture it uncapped, accepting the above.
  content_limits:
    thinking: 65536      # 64 KB
    text: 65536          # 64 KB
    user_prompt: 32768   # 32 KB — reserved; the prompt currently rides the turn span
    tool_input: 16384    # 16 KB
    tool_output: 32768   # 32 KB
